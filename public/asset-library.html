<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Etsyauto 素材库</title>
<style>
:root{--bg:#f7f8f7;--surface:#fff;--surface2:#f1f4f2;--border:#dfe5df;--text:#1d2420;--muted:#69746f;--accent:#315f54;--ok:#0f7a55;--ok-bg:#eaf7f1;--warn:#b46a10;--warn-bg:#fff5e6;--bad:#c63535;--bad-bg:#fff0f0;--shadow:0 1px 2px rgba(20,30,24,.08),0 8px 20px rgba(20,30,24,.05)}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px}button,input{font:inherit}.container{max-width:1380px;margin:0 auto;padding:0 24px}header{position:sticky;top:0;background:rgba(255,255,255,.94);border-bottom:1px solid var(--border);z-index:10}.nav{height:64px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:850;font-size:18px}.links{display:flex;gap:10px}.links a{color:var(--muted);text-decoration:none;font-weight:650;padding:8px 10px;border-radius:8px}.links a.active,.links a:hover{background:var(--surface2);color:var(--text)}main{padding:28px 0 54px}.toolbar{display:flex;gap:12px;align-items:end;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap}.toolbar h1{margin:0 0 6px;font-size:28px}.muted{color:var(--muted);font-size:12px}.panel{background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);padding:14px}.btn{border:0;border-radius:8px;padding:10px 14px;font-weight:750;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn.primary{background:var(--accent);color:#fff}.btn.secondary{background:#fff;border:1px solid var(--border);color:var(--text)}.btn.danger{background:var(--bad-bg);color:var(--bad)}.grid{columns:5 190px;column-gap:14px}.card{break-inside:avoid;background:#fff;border:1px solid var(--border);border-radius:12px;margin:0 0 14px;overflow:hidden;box-shadow:var(--shadow)}.card img{width:100%;display:block;background:var(--surface2)}.body{padding:10px}.badge{display:inline-flex;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:850}.pass{background:var(--ok-bg);color:var(--ok)}.warning{background:var(--warn-bg);color:var(--warn)}.fail{background:var(--bad-bg);color:var(--bad)}.meta{display:grid;gap:5px;margin:8px 0}.actions{display:flex;gap:7px;flex-wrap:wrap}.empty{text-align:center;padding:60px;background:#fff;border:1px dashed var(--border);border-radius:12px;color:var(--muted)}dialog{border:0;border-radius:14px;box-shadow:0 24px 90px rgba(0,0,0,.24);max-width:980px;width:calc(100vw - 40px);padding:0}dialog::backdrop{background:rgba(20,30,24,.42)}.detail{display:grid;grid-template-columns:minmax(260px,1fr) 360px}.detail img{width:100%;height:100%;max-height:78vh;object-fit:contain;background:var(--surface2)}.detail-side{padding:18px;max-height:78vh;overflow:auto}.prompt{white-space:pre-wrap;background:var(--surface2);border-radius:8px;padding:10px;font-size:12px;line-height:1.5}@media(max-width:900px){.grid{columns:2 160px}.detail{grid-template-columns:1fr}.detail img{max-height:55vh}}
</style>
</head>
<body>
<header><div class="container nav"><div class="brand">Etsyauto · 素材库</div><nav class="links"><a href="/etsy-image-agent">图片 Agent</a><a class="active" href="/asset-library">素材库</a><a href="/settings/openai">OpenAI 设置</a></nav></div></header>
<main><div class="container">
  <section class="toolbar">
    <div><h1>待审查候选素材</h1><div class="muted">主工作台生成后的候选图会保存在这里；点击过关后会输出到桌面“图片输出”并从素材库清理。</div></div>
    <div class="panel actions"><button class="btn secondary" onclick="loadAssets()">刷新</button><button class="btn danger" onclick="bulkDelete()">删除当前候选</button><a class="btn primary" href="/etsy-image-agent">回到主工作台</a></div>
  </section>
  <section id="assetGrid" class="grid"></section>
</div></main>
<dialog id="detailDialog"><div id="detail"></div></dialog>
<script>
async function api(url,opts){const r=await fetch(url,opts);const j=await r.json().catch(()=>({ok:false,error:'Invalid response'}));if(!r.ok||j.ok===false)throw new Error(j.error||`HTTP ${r.status}`);return j.data;}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
let assets=[];
async function loadAssets(){assets=await api('/api/etsy-agent/assets');render();}
function render(){const grid=document.getElementById('assetGrid');if(!assets.length){grid.className='empty';grid.textContent='暂无待审查候选图。生成一批图片后，这里会显示候选素材。';return;}grid.className='grid';grid.innerHTML=assets.map(a=>`<article class="card"><img src="${esc(a.publicUrl)}" alt="" onclick="openDetail('${esc(a.assetId)}')"><div class="body"><div><span class="badge warning">${esc(a.reviewStatus||'pending')}</span> <span class="badge ${a.qualityStatus}">质量 ${esc(a.qualityStatus)}</span></div><div class="meta muted"><span>${esc(a.baseName||a.productGroupId)}</span><span>${esc(a.inputFileName||'')} · ${esc(a.promptFileName||'')}</span><span>${esc(a.outputSize)} · ${esc(a.model)}</span></div><div class="actions"><a class="btn secondary" href="/api/etsy-agent/assets/download?assetId=${esc(a.assetId)}">下载候选</a><button class="btn danger" onclick="deleteAsset('${esc(a.assetId)}')">删除</button></div></div></article>`).join('');}
function openDetail(id){const a=assets.find(x=>x.assetId===id);if(!a)return;detail.innerHTML=`<div class="detail"><img src="${esc(a.publicUrl)}"><div class="detail-side"><h2>${esc(a.baseName||'候选图')}</h2><p class="muted">${esc(a.assetId)}</p><p><span class="badge warning">${esc(a.reviewStatus||'pending')}</span> <span class="badge ${a.qualityStatus}">质量 ${esc(a.qualityStatus)}</span></p><h3>文件</h3><p class="muted">图片：${esc(a.inputFileName||'')}<br>提示词：${esc(a.promptFileName||'')}</p><h3>质量原因</h3><p>${esc(a.qualityReason)}</p><h3>Prompt</h3><div class="prompt">${esc(a.optimizedPrompt)}</div><div class="actions" style="margin-top:14px"><a class="btn primary" href="/api/etsy-agent/assets/download?assetId=${esc(a.assetId)}">下载候选</a><button class="btn secondary" onclick="detailDialog.close()">关闭</button></div></div></div>`;detailDialog.showModal();}
async function deleteAsset(id){if(!confirm('删除这张候选素材？本地候选文件和 metadata 都会移除。'))return;await api('/api/etsy-agent/assets/'+id,{method:'DELETE'});assets=assets.filter(a=>a.assetId!==id);render();}
async function bulkDelete(){if(!assets.length)return;if(!confirm(`删除当前 ${assets.length} 张候选素材？`))return;await api('/api/etsy-agent/assets/bulk-delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({assetIds:assets.map(a=>a.assetId)})});assets=[];render();}
loadAssets().catch(e=>{assetGrid.className='empty';assetGrid.textContent=e.message});
</script>
</body>
</html>
