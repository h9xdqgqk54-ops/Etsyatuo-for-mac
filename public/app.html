<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Etsy Sourcing Workflow</title>
<style>
/* ═══════════════════════════════════════════════════════════
   Design System — Modern SaaS (Shopify / Canva / Notion AI)
   ═══════════════════════════════════════════════════════════ */
:root {
  --bg: #f8f9fb;
  --surface: #fff;
  --border: #e8ecf1;
  --text: #1a1d23;
  --text2: #6b7280;
  --accent: #4f46e5;
  --accent2: #7c3aed;
  --green: #059669;
  --green-bg: #ecfdf5;
  --amber: #d97706;
  --amber-bg: #fffbeb;
  --red: #dc2626;
  --red-bg: #fef2f2;
  --blue-bg: #eff6ff;
  --radius: 12px;
  --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow-lg: 0 4px 24px rgba(0,0,0,.08);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh}
button{cursor:pointer;font-family:inherit}
.container{max-width:1280px;margin:0 auto;padding:0 24px}

/* ── Header ───────────────────────────────────────────── */
header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 0;position:sticky;top:0;z-index:100}
header .container{display:flex;align-items:center;justify-content:space-between}
.logo{font-weight:800;font-size:18px;display:flex;align-items:center;gap:8px}
.logo span{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600}
.badge-warn{background:var(--amber-bg);color:var(--amber)}
.badge-ok{background:var(--green-bg);color:var(--green)}

/* ── Stepper ──────────────────────────────────────────── */
.stepper{display:flex;justify-content:center;gap:0;padding:32px 0;background:var(--surface);border-bottom:1px solid var(--border)}
.step-item{display:flex;align-items:center;gap:10px;padding:12px 24px;position:relative;font-size:14px;color:var(--text2);font-weight:500;transition:color .2s}
.step-item.active{color:var(--accent);font-weight:700}
.step-item.done{color:var(--green)}
.step-num{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;border:2px solid var(--border);background:var(--surface);transition:all .2s}
.step-item.active .step-num{background:var(--accent);border-color:var(--accent);color:#fff}
.step-item.done .step-num{background:var(--green);border-color:var(--green);color:#fff}
.step-connector{width:40px;height:2px;background:var(--border);align-self:center;margin:0 4px}
.step-connector.done{background:var(--green)}

/* ── Main Content ─────────────────────────────────────── */
main{padding:32px 0;min-height:60vh}
.step-panel{display:none}
.step-panel.active{display:block}

/* ── Search Bar ───────────────────────────────────────── */
.search-box{display:flex;gap:12px;max-width:600px;margin:0 auto 32px}
.search-box input{flex:1;padding:14px 20px;border:2px solid var(--border);border-radius:var(--radius);font-size:16px;outline:none;transition:border-color .2s}
.search-box input:focus{border-color:var(--accent)}
.btn{padding:12px 28px;border:none;border-radius:var(--radius);font-size:15px;font-weight:600;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:#4338ca;transform:translateY(-1px);box-shadow:var(--shadow-lg)}
.btn-secondary{background:var(--surface);color:var(--text);border:2px solid var(--border)}
.btn-secondary:hover{background:#f9fafb}
.btn-green{background:var(--green);color:#fff}
.btn-green:hover{background:#047857}
.btn-outline{background:transparent;color:var(--accent);border:2px solid var(--accent)}
.btn-sm{padding:6px 14px;font-size:12px;border-radius:8px}
.btn-xs{padding:3px 10px;font-size:11px;border-radius:6px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important}

/* ── Stats Bar ────────────────────────────────────────── */
.stats-bar{display:flex;gap:24px;margin-bottom:24px;flex-wrap:wrap}
.stat-card{background:var(--surface);border-radius:var(--radius);padding:16px 24px;box-shadow:var(--shadow);min-width:120px}
.stat-card .stat-value{font-size:28px;font-weight:800;line-height:1.2}
.stat-card .stat-label{font-size:12px;color:var(--text2);margin-top:2px}

/* ── Product Grid ─────────────────────────────────────── */
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.product-card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;transition:all .2s;border:2px solid transparent;position:relative}
.product-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.product-card.selected{border-color:var(--accent)}
.product-card .card-img{height:180px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.product-card .card-img img,.product-card .card-img svg{width:100%;height:100%;object-fit:cover}
.product-card .card-body{padding:16px}
.product-card .card-title{font-size:13px;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:8px}
.product-card .card-meta{display:flex;gap:16px;font-size:12px;color:var(--text2);margin-bottom:8px}
.product-card .card-price{font-size:20px;font-weight:800;color:var(--text)}
.product-card .card-score{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700}
.score-high{background:var(--green-bg);color:var(--green)}
.score-mid{background:var(--blue-bg);color:var(--accent)}
.score-low{background:var(--amber-bg);color:var(--amber)}
.product-card .card-check{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:50%;border:2px solid #d1d5db;background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;z-index:2}
.product-card .card-check:hover{border-color:var(--accent)}
.product-card.selected .card-check{background:var(--accent);border-color:var(--accent)}
.product-card.selected .card-check::after{content:'✓';color:#fff;font-size:14px;font-weight:700}
.product-card .card-reasons{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.product-card .card-reason{font-size:10px;padding:2px 8px;background:var(--blue-bg);color:var(--accent);border-radius:10px}

/* ── Action Bar ───────────────────────────────────────── */
.action-bar{position:sticky;bottom:24px;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;margin-top:24px;border:1px solid var(--border)}
.action-bar .selected-count{font-weight:700;font-size:15px}

/* ── Step 2: Match Table ──────────────────────────────── */
.match-row{display:grid;grid-template-columns:1fr 40px 1fr;gap:16px;align-items:start;margin-bottom:24px;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.match-etsy,.match-1688{display:flex;gap:12px}
.match-img{width:80px;height:80px;border-radius:8px;overflow:hidden;flex-shrink:0;background:var(--bg)}
.match-img img,.match-img svg{width:100%;height:100%;object-fit:cover}
.match-info{flex:1;min-width:0}
.match-info .match-title{font-size:13px;font-weight:600;margin-bottom:4px;line-height:1.3}
.match-info .match-price{font-size:18px;font-weight:800}
.match-info .match-link{font-size:11px;color:var(--accent);word-break:break-all}
.match-vs{display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:var(--text2)}
.match-margin{text-align:center;padding:4px 12px;border-radius:20px;font-size:13px;font-weight:700;margin-top:8px}
.margin-great{background:var(--green-bg);color:var(--green)}
.margin-good{background:var(--blue-bg);color:var(--accent)}
.margin-ok{background:var(--amber-bg);color:var(--amber)}

/* ═══════════════════════════════════════════════════════════
   Step 3: Workbench Layout
   ═══════════════════════════════════════════════════════════ */
.wb-container{display:flex;flex-direction:column;height:calc(100vh - 200px);min-height:550px}

/* ── Nav bar ──────────────────────────────────────────── */
.wb-nav{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);margin-bottom:12px;flex-shrink:0}
.wb-nav select{padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;min-width:280px;background:var(--surface);cursor:pointer}
.wb-nav select:focus{outline:none;border-color:var(--accent)}
.wb-nav .wb-nav-info{font-size:12px;color:var(--text2);white-space:nowrap}
.wb-nav .wb-nav-btns{margin-left:auto;display:flex;gap:6px}

/* ── Three-column grid ────────────────────────────────── */
.wb-layout{display:grid;grid-template-columns:270px 1fr 350px;gap:16px;flex:1;overflow:hidden;min-height:0}

.wb-left,.wb-center,.wb-right{overflow-y:auto;overflow-x:hidden;padding-right:4px}
.wb-left{border-right:1px solid var(--border);padding-right:12px}
.wb-center{border-right:1px solid var(--border);padding:0 12px}
.wb-right{padding-left:4px}

/* ── Shared panel sections ────────────────────────────── */
.wb-section{background:var(--surface);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow);margin-bottom:12px}
.wb-section h3{font-size:12px;font-weight:700;margin-bottom:8px;color:var(--text);display:flex;align-items:center;gap:6px}
.wb-section h3 .status-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.wb-section h3 .status-dot.pending{background:#d1d5db}
.wb-section h3 .status-dot.generating{background:var(--accent);animation:pulse .8s ease-in-out infinite}
.wb-section h3 .status-dot.success{background:var(--green)}
.wb-section h3 .status-dot.failed{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* Info rows (left panel) */
.wb-info-row{margin-bottom:8px}
.wb-info-row label{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:2px}
.wb-info-row p{font-size:12px;font-weight:600;word-break:break-all}
.wb-info-row .wb-price{font-size:16px;font-weight:800;color:var(--text)}
.wb-link{font-size:11px;color:var(--accent);text-decoration:none;display:inline-block;margin-top:2px}
.wb-link:hover{text-decoration:underline}

/* Collapsible sections */
.wb-collapse-header{cursor:pointer;font-size:11px;font-weight:600;color:var(--text2);padding:8px 0;border-top:1px solid var(--border);user-select:none;display:flex;align-items:center;gap:6px;margin-top:4px}
.wb-collapse-header .arrow{transition:transform .2s;font-size:10px;display:inline-block}
.wb-collapse-header.open .arrow{transform:rotate(90deg)}
.wb-collapse-body{max-height:0;overflow:hidden;transition:max-height .3s ease}
.wb-collapse-body.open{max-height:500px}
.wb-text-block{font-size:11px;line-height:1.6;color:var(--text);background:var(--bg);border-radius:6px;padding:8px 10px;margin-bottom:6px;white-space:pre-wrap;word-break:break-all;max-height:180px;overflow-y:auto}
.wb-text-block+.wb-copy-btn{font-size:10px;color:var(--accent);cursor:pointer;border:none;background:none;padding:2px 0}

/* ── Center: Image Grid ───────────────────────────────── */
.wb-img-toolbar{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.wb-img-toolbar .toolbar-label{font-size:11px;color:var(--text2);font-weight:600}

.wb-img-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;align-content:start}

.wb-img-card{background:var(--surface);border-radius:10px;border:2px solid var(--border);overflow:hidden;cursor:pointer;transition:all .15s;position:relative}
.wb-img-card:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow)}
.wb-img-card.active{border-color:var(--accent2);box-shadow:0 0 0 2px rgba(124,58,237,.25)}

.wb-img-card .wb-img-thumb{width:100%;aspect-ratio:1;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.wb-img-card .wb-img-thumb img,.wb-img-card .wb-img-thumb svg{width:100%;height:100%;object-fit:cover}

.wb-img-card .wb-img-label{font-size:10px;padding:5px 8px;color:var(--text2);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Status dot on thumbnail */
.wb-img-status{position:absolute;bottom:5px;right:5px;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.25);color:#fff}
.wb-img-status.pending{background:#cbd5e1;color:#64748b}
.wb-img-status.generating{background:var(--accent);animation:pulse .8s ease-in-out infinite}
.wb-img-status.success{background:var(--green)}
.wb-img-status.failed{background:var(--red)}

/* Checkbox on thumbnail */
.wb-img-check{position:absolute;top:5px;left:5px;width:20px;height:20px;border-radius:4px;border:2px solid rgba(255,255,255,.85);background:rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;z-index:2}
.wb-img-check:hover{background:rgba(0,0,0,.45)}
.wb-img-check.checked{background:var(--accent);border-color:var(--accent)}
.wb-img-check.checked::after{content:'✓';color:#fff;font-size:11px;font-weight:700}

/* Generate button on hover */
.wb-img-card .wb-img-gen-btn{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);padding:3px 10px;border-radius:12px;background:var(--accent);color:#fff;font-size:10px;font-weight:600;border:none;cursor:pointer;opacity:0;transition:opacity .15s;white-space:nowrap;z-index:2}
.wb-img-card:hover .wb-img-gen-btn{opacity:1}
.wb-img-card .wb-img-gen-btn:disabled{opacity:.5;cursor:not-allowed}

/* ── Right: Preview + Text ────────────────────────────── */
.wb-preview-box{width:100%;aspect-ratio:1;background:var(--bg);border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid var(--border);position:relative;margin-bottom:8px}
.wb-preview-box img,.wb-preview-box svg{width:100%;height:100%;object-fit:cover}
.wb-preview-placeholder{color:var(--text2);font-size:12px;text-align:center;padding:20px;line-height:1.6}

.wb-preview-toggle{position:absolute;top:6px;right:6px;font-size:10px;background:rgba(0,0,0,.55);color:#fff;padding:3px 8px;border-radius:10px;cursor:pointer;z-index:2;border:none}
.wb-preview-toggle:hover{background:rgba(0,0,0,.75)}

.wb-preview-info{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.wb-preview-label{font-size:11px;font-weight:600;color:var(--text)}
.wb-preview-status{font-size:11px;font-weight:600}

.wb-field{margin-bottom:8px}
.wb-field label{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;justify-content:space-between;margin-bottom:3px}
.wb-field textarea{width:100%;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:11px;font-family:inherit;resize:vertical;min-height:50px;line-height:1.5}
.wb-field textarea:focus{outline:none;border-color:var(--accent)}

.wb-gen-actions{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}

/* ── Action bar additions ─────────────────────────────── */
.action-bar .batch-actions{display:flex;gap:8px;align-items:center}

/* Status text helpers */
.status-pending{color:var(--text2)}
.status-generating{color:var(--accent)}
.status-success{color:var(--green)}
.status-failed{color:var(--red)}

.spinner{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Step 4: Publish ──────────────────────────────────── */
.publish-list{display:flex;flex-direction:column;gap:12px}
.publish-item{display:flex;align-items:center;gap:16px;background:var(--surface);border-radius:var(--radius);padding:16px 20px;box-shadow:var(--shadow)}
.publish-item .pub-img{width:56px;height:56px;border-radius:8px;overflow:hidden;flex-shrink:0}
.publish-item .pub-img img,.publish-item .pub-img svg{width:100%;height:100%;object-fit:cover}
.publish-item .pub-info{flex:1;min-width:0}
.publish-item .pub-title{font-weight:600;font-size:14px;margin-bottom:4px}
.publish-item .pub-meta{font-size:12px;color:var(--text2)}
.publish-item .pub-status{text-align:right}
.publish-summary{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:32px;text-align:center;margin-bottom:24px}
.publish-summary h2{font-size:24px;margin-bottom:8px}
.publish-summary p{color:var(--text2);margin-bottom:24px}

/* ── Toast ────────────────────────────────────────────── */
.toast-container{position:fixed;bottom:24px;right:24px;z-index:999;display:flex;flex-direction:column;gap:8px}
.toast{padding:14px 24px;border-radius:10px;color:#fff;font-size:14px;font-weight:600;animation:slideUp .3s;box-shadow:var(--shadow-lg)}
.toast-info{background:var(--accent)}
.toast-ok{background:var(--green)}
.toast-err{background:var(--red)}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* ── Empty State ──────────────────────────────────────── */
.empty-state{text-align:center;padding:60px 20px}
.empty-state .empty-icon{font-size:48px;margin-bottom:16px}
.empty-state h3{font-size:18px;margin-bottom:8px}
.empty-state p{color:var(--text2);max-width:400px;margin:0 auto}

/* ── Responsive ───────────────────────────────────────── */
@media(max-width:768px){
  .product-grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
  .match-row{grid-template-columns:1fr}
  .match-vs{transform:rotate(90deg)}
  .stepper{flex-wrap:wrap;gap:8px}
  .step-connector{display:none}
}
@media(max-width:1100px){
  .wb-layout{grid-template-columns:1fr;grid-template-rows:auto auto auto;overflow-y:auto}
  .wb-left,.wb-center{border-right:none;padding-right:0}
  .wb-right{padding-left:0}
  .wb-container{height:auto;min-height:0}
}
</style>
</head>
<body>

<header>
  <div class="container">
    <div class="logo"><span>✦</span> <span>Etsy Sourcing Workflow</span></div>
    <div>
      <span class="badge badge-warn" id="apiBadgeImg">Image2: mock</span>
      &nbsp;
      <span class="badge badge-warn" id="apiBadgeTxt">Deepseek: mock</span>
    </div>
  </div>
</header>

<div class="stepper" id="stepper">
  <div class="step-item active" data-step="1"><div class="step-num">1</div>选品搜索</div>
  <div class="step-connector"></div>
  <div class="step-item" data-step="2"><div class="step-num">2</div>1688货源匹配</div>
  <div class="step-connector"></div>
  <div class="step-item" data-step="3"><div class="step-num">3</div>AI内容生成</div>
  <div class="step-connector"></div>
  <div class="step-item" data-step="4"><div class="step-num">4</div>发布到Etsy</div>
</div>

<main>
<div class="container">

<!-- ════════════════════════════════════════════════════════
   STEP 1 — Search & Select
   ════════════════════════════════════════════════════════ -->
<div class="step-panel active" id="panel-step1">
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="输入Etsy搜索关键词，例如: silver ring, handmade necklace..." value="silver ring" onkeydown="if(event.key==='Enter')searchProducts()">
    <button class="btn btn-primary" onclick="searchProducts()">🔍 开始选品</button>
  </div>

  <div class="stats-bar" id="stats1" style="display:none">
    <div class="stat-card"><div class="stat-value" id="statTotal">—</div><div class="stat-label">商品总数</div></div>
    <div class="stat-card"><div class="stat-value" id="statAvgPrice">—</div><div class="stat-label">均价</div></div>
    <div class="stat-card"><div class="stat-value" id="statBest">—</div><div class="stat-label">最高评分</div></div>
    <div class="stat-card"><div class="stat-value" style="color:var(--accent)" id="statSelected">0</div><div class="stat-label">已选择</div></div>
  </div>

  <div id="productGrid" class="product-grid"></div>

  <div class="action-bar" id="action1" style="display:none">
    <div>
      <button class="btn btn-sm btn-secondary" onclick="selectAll(true)">全选</button>
      <button class="btn btn-sm btn-secondary" onclick="selectAll(false)" style="margin-left:8px">取消全选</button>
    </div>
    <div class="selected-count">已选择 <span id="selCount">0</span> 件商品</div>
    <button class="btn btn-green" onclick="goStep2()">查找1688货源 →</button>
  </div>
</div>

<!-- ════════════════════════════════════════════════════════
   STEP 2 — 1688 Matching
   ════════════════════════════════════════════════════════ -->
<div class="step-panel" id="panel-step2">
  <div class="stats-bar" id="stats2" style="display:none">
    <div class="stat-card"><div class="stat-value" id="statMatches">—</div><div class="stat-label">匹配货源</div></div>
    <div class="stat-card"><div class="stat-value" style="color:var(--green)" id="statAvgMargin">—</div><div class="stat-label">平均利润率</div></div>
  </div>
  <div id="matchList"></div>
  <div class="action-bar" id="action2" style="display:none">
    <button class="btn btn-secondary" onclick="goStep1()">← 返回选品</button>
    <button class="btn btn-primary" onclick="goStep3()">AI生成Etsy内容 →</button>
  </div>
</div>

<!-- ════════════════════════════════════════════════════════
   STEP 3 — AI Workbench
   ════════════════════════════════════════════════════════ -->
<div class="step-panel" id="panel-step3">
  <div style="margin-bottom:12px;color:var(--text2);font-size:12px;display:flex;align-items:center;gap:6px">
    <span style="font-size:16px">⚠️</span> 默认不自动调用 API。请点击按钮手动触发生成，避免浪费额度。
  </div>

  <div class="wb-container" id="wbContainer">
    <!-- Nav: match selector -->
    <div class="wb-nav" id="wbNav" style="display:none">
      <select id="wbMatchSelect" onchange="jumpToMatch(this.value)"></select>
      <button class="btn btn-xs btn-secondary" onclick="navigateMatch(-1)" title="上一个">◀</button>
      <button class="btn btn-xs btn-secondary" onclick="navigateMatch(1)" title="下一个">▶</button>
      <span class="wb-nav-info" id="wbNavInfo"></span>
    </div>

    <div class="wb-layout" id="wbLayout">
      <!-- LEFT: Source info + original copy -->
      <div class="wb-left" id="wbLeft"></div>

      <!-- CENTER: Image grid -->
      <div class="wb-center" id="wbCenter"></div>

      <!-- RIGHT: Preview + AI text -->
      <div class="wb-right" id="wbRight"></div>
    </div>
  </div>

  <div class="empty-state" id="wbEmpty">
    <div class="empty-icon">🔗</div>
    <h3>没有可生成的内容</h3>
    <p>请先在 Step 2 完成1688货源匹配，再进入此步骤。</p>
    <button class="btn btn-secondary" onclick="goStep2()" style="margin-top:16px">← 返回货源匹配</button>
  </div>

  <div class="action-bar" id="action3" style="display:none">
    <div class="batch-actions">
      <button class="btn btn-sm btn-secondary" onclick="selectAllImages(true)">全选图片</button>
      <button class="btn btn-sm btn-secondary" onclick="selectAllImages(false)">取消全选</button>
      <button class="btn btn-sm btn-outline" onclick="generateSelectedImages()">生成选中图片</button>
      <button class="btn btn-sm btn-outline" onclick="generateAllImages()">生成全部图片</button>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-sm" style="background:#333;color:#fff" onclick="downloadResults()">⬇ 下载结果</button>
      <button class="btn btn-secondary" onclick="goStep2()">← 返回货源</button>
      <button class="btn btn-primary" onclick="goStep4()">准备发布 →</button>
    </div>
  </div>
</div>

<!-- ════════════════════════════════════════════════════════
   STEP 4 — Publish
   ════════════════════════════════════════════════════════ -->
<div class="step-panel" id="panel-step4">
  <div id="publishContent"></div>
  <div class="action-bar" id="action4" style="display:none">
    <button class="btn btn-secondary" onclick="goStep3()">← 返回编辑</button>
    <button class="btn btn-green" onclick="publishAll()">🚀 发布到 Etsy (Mock)</button>
  </div>
</div>

</div>
</main>

<div class="toast-container" id="toastContainer"></div>

<script>
// ═══════════════════════════════════════════════════════════════
// State
// ═══════════════════════════════════════════════════════════════
const S = {
  step: 1,
  products: [],
  matches: [],
  generations: {},
  currentMatchIndex: 0,
  activeImageId: null,
  previewShowingAI: false,
};

// ═══════════════════════════════════════════════════════════════
// API
// ═══════════════════════════════════════════════════════════════
async function api(url, opts) {
  const res = await fetch(url, opts);
  if (!res.ok) { const e = await res.json().catch(()=>({})); throw new Error(e.error||`HTTP ${res.status}`); }
  return res.json();
}

// ═══════════════════════════════════════════════════════════════
// Navigation
// ═══════════════════════════════════════════════════════════════
function showStep(n) {
  S.step = n;
  document.querySelectorAll('.step-panel').forEach(p => p.classList.remove('active'));
  document.getElementById(`panel-step${n}`).classList.add('active');
  document.querySelectorAll('.step-item').forEach((el,i) => {
    el.classList.remove('active','done');
    if (i+1 === n) el.classList.add('active');
    if (i+1 < n) el.classList.add('done');
  });
  document.querySelectorAll('.step-connector').forEach((el,i) => {
    el.classList.toggle('done', i+1 < n);
  });
  window.scrollTo({top:0,behavior:'smooth'});
}

function goStep1() { showStep(1); renderStep1(); }
function goStep2() { showStep(2); runMatching(); }
function goStep3() { showStep(3); renderStep3(); }
function goStep4() { showStep(4); renderStep4(); }

// ═══════════════════════════════════════════════════════════════
// Step 1 — Search & Select
// ═══════════════════════════════════════════════════════════════
async function searchProducts() {
  const kw = document.getElementById('searchInput').value.trim();
  if (!kw) return toast('请输入搜索关键词','err');
  try {
    toast('正在搜索 Etsy...', 'info');
    await api('/api/step1/search', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({keyword:kw}) });
    const data = await api('/api/products');
    S.products = data;
    S.matches = [];
    S.generations = {};
    renderStep1();
    document.getElementById('stats1').style.display = 'flex';
    document.getElementById('action1').style.display = 'flex';
    toast(`找到 ${data.length} 件商品`, 'ok');
  } catch(e) { toast('搜索失败: '+e.message, 'err'); }
}

function renderStep1() {
  const p = S.products;
  if (!p.length) {
    document.getElementById('productGrid').innerHTML = '<div class="empty-state"><div class="empty-icon">🔍</div><h3>输入关键词开始选品</h3><p>输入 Etsy 搜索关键词（如 "silver ring"），系统将展示热门商品并给出推荐评分。</p></div>';
    return;
  }
  document.getElementById('statTotal').textContent = p.length;
  const avg = p.reduce((s,x)=>s+x.price,0)/p.length;
  document.getElementById('statAvgPrice').textContent = '$'+avg.toFixed(0);
  document.getElementById('statBest').textContent = p[0]?.score||'—';
  updateSelectionCount();

  document.getElementById('productGrid').innerHTML = p.map((x,i) => {
    const scoreCls = x.score >= 50 ? 'score-high' : (x.score >= 30 ? 'score-mid' : 'score-low');
    const selCls = x.selected ? 'selected' : '';
    return `<div class="product-card ${selCls}" id="card_${x.id}">
      <div class="card-check" onclick="toggleSelect('${x.id}')"></div>
      <div class="card-img"><img src="/api/placeholder/${x.id}" alt="${esc(x.title)}" loading="lazy" onerror="this.parentElement.innerHTML=this.alt[0]"></div>
      <div class="card-body">
        <div class="card-title" title="${esc(x.title)}">${esc(x.title)}</div>
        <div class="card-meta">
          <span>🛒 ${x.sales}</span><span>❤️ ${x.favorites}</span>
        </div>
        <div class="card-price">${x.priceDisplay}</div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px">
          <span class="card-score ${scoreCls}">★ ${x.score}分</span>
          <a href="${esc(x.url)}" target="_blank" style="font-size:11px;color:var(--accent)">Etsy →</a>
        </div>
        <div class="card-reasons">${x.scoreReasons.map(r=>`<span class="card-reason">${esc(r)}</span>`).join('')}</div>
      </div>
    </div>`;
  }).join('');
}

function toggleSelect(id) {
  api('/api/step1/select', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id}) });
  const p = S.products.find(x=>x.id===id);
  if (p) p.selected = !p.selected;
  const card = document.getElementById('card_'+id);
  if (card) card.classList.toggle('selected', p?.selected);
  updateSelectionCount();
}

function selectAll(v) {
  api('/api/step1/select-all', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({select:v}) });
  S.products.forEach(p=>p.selected=v);
  renderStep1();
}

function updateSelectionCount() {
  const n = S.products.filter(p=>p.selected).length;
  document.getElementById('selCount').textContent = n;
  document.getElementById('statSelected').textContent = n;
}

// ═══════════════════════════════════════════════════════════════
// Step 2 — 1688 Matching
// ═══════════════════════════════════════════════════════════════
async function runMatching() {
  try {
    toast('正在匹配1688货源...', 'info');
    const data = await api('/api/step2/match', { method:'POST', headers:{'Content-Type':'application/json'}, body:'{}' });
    const matches = await api('/api/matches');
    S.matches = matches;
    renderStep2();
    document.getElementById('stats2').style.display = 'flex';
    document.getElementById('action2').style.display = 'flex';
    toast(`匹配到 ${matches.length} 个1688货源`, 'ok');
  } catch(e) { toast('匹配失败: '+e.message, 'err'); }
}

function renderStep2() {
  const m = S.matches;
  if (!m.length) {
    document.getElementById('matchList').innerHTML = '<div class="empty-state"><div class="empty-icon">🔗</div><h3>没有匹配结果</h3><p>请先在 Step 1 选择商品。</p></div>';
    return;
  }
  document.getElementById('statMatches').textContent = m.length;
  const avgMargin = m.reduce((s,x)=>s+x.profitMargin,0)/m.length;
  document.getElementById('statAvgMargin').textContent = avgMargin.toFixed(0)+'%';

  document.getElementById('matchList').innerHTML = m.map((x,i) => {
    const prod = S.products.find(p=>p.id===x.etsyId);
    const marginCls = x.profitMargin >= 70 ? 'margin-great' : (x.profitMargin >= 50 ? 'margin-good' : 'margin-ok');
    return `<div class="match-row">
      <div class="match-etsy">
        <div class="match-img"><img src="/api/placeholder/${x.etsyId}" alt="" loading="lazy"></div>
        <div class="match-info">
          <div class="match-title">${esc(prod?.title||'')}</div>
          <div class="match-price">${prod?.priceDisplay||''}</div>
          <a class="match-link" href="${esc(prod?.url||'')}" target="_blank">Etsy →</a>
        </div>
      </div>
      <div class="match-vs">VS</div>
      <div class="match-1688">
        <div class="match-img"><img src="${x.imageUrl}" alt="" loading="lazy"></div>
        <div class="match-info">
          <div class="match-title">${esc(x.title)}</div>
          <div class="match-price">${x.priceDisplay}</div>
          <a class="match-link" href="${esc(x.url)}" target="_blank">1688 →</a>
          <div class="match-margin ${marginCls}">利润率 ${x.profitMargin}%</div>
        </div>
      </div>
    </div>`;
  }).join('');
}

// ═══════════════════════════════════════════════════════════════
// Step 3 — AI Workbench
// ═══════════════════════════════════════════════════════════════

function curMatch() { return S.matches[S.currentMatchIndex]; }
function curGen() {
  const m = curMatch();
  if (!m) return null;
  if (!S.generations[m.etsyId]) {
    S.generations[m.etsyId] = {
      images: (m.simulatedImages||[]).map(si => ({
        id: si.id, label: si.label, originalUrl: si.url,
        generatedUrl: '', imageStatus: 'pending', selected: false
      })),
      optimizedTitle: '', optimizedDescription: '', optimizedTags: '', suggestedPrice: '',
      textStatus: 'pending', textError: '',
      originalTitle: m.title,
      originalDescription: `【1688原版商品描述】\n\n${m.title}\n批发价：${m.priceDisplay}\n预估利润率：${m.profitMargin}%\n\n材质工艺：高端工艺，厂家直供。`,
      originalTags: m.title.replace(/\s+/g, ','),
    };
  }
  return S.generations[m.etsyId];
}

function renderStep3() {
  if (!S.matches.length) {
    document.getElementById('wbContainer').style.display = 'none';
    document.getElementById('wbEmpty').style.display = '';
    document.getElementById('wbNav').style.display = 'none';
    document.getElementById('action3').style.display = 'none';
    return;
  }
  document.getElementById('wbContainer').style.display = '';
  document.getElementById('wbEmpty').style.display = 'none';
  document.getElementById('wbNav').style.display = 'flex';
  document.getElementById('action3').style.display = 'flex';

  // Populate match selector
  const sel = document.getElementById('wbMatchSelect');
  sel.innerHTML = S.matches.map((m, i) => {
    const prod = S.products.find(p => p.id === m.etsyId);
    return `<option value="${i}" ${i === S.currentMatchIndex ? 'selected' : ''}>${esc((prod?.title || m.title).slice(0, 60))}</option>`;
  }).join('');

  refreshWorkbench();
}

function refreshWorkbench() {
  const match = curMatch();
  const gen = curGen();
  if (!match || !gen) return;
  document.getElementById('wbNavInfo').textContent = `${S.currentMatchIndex + 1} / ${S.matches.length}`;
  populateLeftPanel(match, gen);
  renderImageGrid(match, gen);
  populateRightPanel(match, gen);
}

// ── Left Panel ──────────────────────────────────────────

function populateLeftPanel(match, gen) {
  const product = S.products.find(p => p.id === match.etsyId);
  document.getElementById('wbLeft').innerHTML = `
    <div class="wb-section">
      <h3>📦 1688 货源信息</h3>
      <div class="wb-info-row"><label>1688 标题</label><p>${esc(match.title)}</p></div>
      <div class="wb-info-row"><label>批发价</label><span class="wb-price">${match.priceDisplay}</span></div>
      <div class="wb-info-row"><label>Etsy 原价</label><p>${esc(product?.priceDisplay || '—')}</p></div>
      <div class="wb-info-row"><label>预估利润率</label><p style="color:var(--green);font-weight:700">${match.profitMargin}%</p></div>
      <a class="wb-link" href="${esc(match.url)}" target="_blank">在 1688 查看 →</a>
    </div>

    <div class="wb-section">
      <div class="wb-collapse-header open" onclick="toggleCollapse('wbOrigTitle')">
        <span class="arrow">▶</span> 1688 原标题
      </div>
      <div class="wb-collapse-body open" id="wbOrigTitle">
        <div class="wb-text-block">${esc(gen.originalTitle)}</div>
        <button class="wb-copy-btn" onclick="copyText('origTitle')">📋 复制</button>
        <textarea id="origTitle" style="display:none">${esc(gen.originalTitle)}</textarea>
      </div>

      <div class="wb-collapse-header" onclick="toggleCollapse('wbOrigDesc')">
        <span class="arrow">▶</span> 1688 原描述
      </div>
      <div class="wb-collapse-body" id="wbOrigDesc">
        <div class="wb-text-block">${esc(gen.originalDescription)}</div>
        <button class="wb-copy-btn" onclick="copyText('origDesc')">📋 复制</button>
        <textarea id="origDesc" style="display:none">${esc(gen.originalDescription)}</textarea>
      </div>

      <div class="wb-collapse-header" onclick="toggleCollapse('wbOrigTags')">
        <span class="arrow">▶</span> 1688 原 Tags
      </div>
      <div class="wb-collapse-body" id="wbOrigTags">
        <div class="wb-text-block">${esc(gen.originalTags)}</div>
        <button class="wb-copy-btn" onclick="copyText('origTags')">📋 复制</button>
        <textarea id="origTags" style="display:none">${esc(gen.originalTags)}</textarea>
      </div>
    </div>`;
}

function toggleCollapse(id) {
  const body = document.getElementById(id);
  if (!body) return;
  const header = body.previousElementSibling;
  const isOpen = body.classList.contains('open');
  body.classList.toggle('open', !isOpen);
  if (header) header.classList.toggle('open', !isOpen);
}

// ── Center Panel: Image Grid ────────────────────────────

function renderImageGrid(match, gen) {
  const imgCount = gen.images.length;
  const doneCount = gen.images.filter(im => im.imageStatus === 'success').length;
  document.getElementById('wbCenter').innerHTML = `
    <div class="wb-section">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <h3 style="margin:0">🖼️ 商品图片 (${imgCount})</h3>
        <span style="font-size:11px;color:var(--text2)">${doneCount}/${imgCount} 已生成</span>
      </div>
      <div class="wb-img-grid" id="wbImgGrid">
        ${gen.images.map(im => renderImageCard(im, match.etsyId)).join('')}
      </div>
    </div>`;
}

function renderImageCard(im, etsyId) {
  const isActive = im.id === S.activeImageId;
  const showUrl = (im.imageStatus === 'success' && im.generatedUrl) ? im.generatedUrl : im.originalUrl;
  const canGen = im.imageStatus !== 'generating';
  const statusIcon = im.imageStatus === 'pending' ? '' :
    im.imageStatus === 'generating' ? '<span class="spinner"></span>' :
    im.imageStatus === 'success' ? '✓' : '✗';
  return `
    <div class="wb-img-card ${isActive ? 'active' : ''}" id="imgCard_${etsyId}_${im.id}" onclick="selectImage('${etsyId}','${im.id}')">
      <div class="wb-img-check ${im.selected ? 'checked' : ''}" onclick="event.stopPropagation();toggleImageSelect('${etsyId}','${im.id}')"></div>
      <div class="wb-img-thumb">
        <img src="${showUrl}" alt="${esc(im.label)}" loading="lazy" onerror="this.style.display='none'">
        ${statusIcon ? `<div class="wb-img-status ${im.imageStatus}">${statusIcon}</div>` : ''}
      </div>
      <button class="wb-img-gen-btn" ${canGen ? '' : 'disabled'} onclick="event.stopPropagation();generateImage('${etsyId}','${im.id}')" title="生成此图">
        ${im.imageStatus === 'generating' ? '生成中...' : '生成图片'}
      </button>
      <div class="wb-img-label">${esc(im.label)}</div>
    </div>`;
}

function selectImage(etsyId, imageId) {
  S.activeImageId = imageId;
  S.previewShowingAI = false;
  refreshWorkbench();
}

function toggleImageSelect(etsyId, imageId) {
  const gen = S.generations[etsyId];
  if (!gen) return;
  const im = gen.images.find(i => i.id === imageId);
  if (!im) return;
  im.selected = !im.selected;
  api('/api/step3/select-image', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ etsyId, imageId, selected: im.selected })
  }).catch(() => {});
  // Update just the checkbox
  const card = document.getElementById(`imgCard_${etsyId}_${imageId}`);
  if (card) {
    const check = card.querySelector('.wb-img-check');
    if (check) check.classList.toggle('checked', im.selected);
  }
}

function selectAllImages(v) {
  const match = curMatch();
  if (!match) return;
  const gen = S.generations[match.etsyId];
  if (!gen) return;
  gen.images.forEach(im => { im.selected = v; });
  api('/api/step3/select-all-images', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ etsyId: match.etsyId, select: v })
  }).catch(() => {});
  refreshWorkbench();
}

// ── Image Generation ─────────────────────────────────────

async function generateImage(etsyId, imageId) {
  const gen = S.generations[etsyId];
  if (!gen) return;
  const im = gen.images.find(i => i.id === imageId);
  if (!im || im.imageStatus === 'generating') return;
  im.imageStatus = 'generating';
  S.activeImageId = imageId;
  refreshWorkbench();
  try {
    const data = await api('/api/step3/generate-image', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ etsyId, imageId })
    });
    Object.assign(im, data);
    refreshWorkbench();
    toast('图片生成完成', im.imageStatus === 'success' ? 'ok' : 'err');
  } catch (e) {
    im.imageStatus = 'failed';
    im.imageError = e.message;
    refreshWorkbench();
    toast('图片生成失败: ' + e.message, 'err');
  }
}

async function generateSelectedImages() {
  const match = curMatch();
  const gen = curGen();
  if (!match || !gen) return;
  const targets = gen.images.filter(im => im.selected && im.imageStatus !== 'success' && im.imageStatus !== 'generating');
  if (!targets.length) return toast('没有选中的待生成图片', 'info');
  toast(`开始生成 ${targets.length} 张图片...`, 'info');
  for (const im of targets) {
    await generateImage(match.etsyId, im.id);
  }
  toast('批量生成完成', 'ok');
}

async function generateAllImages() {
  const match = curMatch();
  const gen = curGen();
  if (!match || !gen) return;
  const pending = gen.images.filter(im => im.imageStatus !== 'success' && im.imageStatus !== 'generating');
  if (!pending.length) return toast('所有图片已生成', 'info');
  toast(`开始生成 ${pending.length} 张图片...`, 'info');
  for (const im of pending) {
    await generateImage(match.etsyId, im.id);
  }
  toast('全部生成完成', 'ok');
}

// ── Text Generation ─────────────────────────────────────

async function generateText() {
  const match = curMatch();
  const gen = curGen();
  if (!match || !gen) return;
  if (gen.textStatus === 'generating') return;
  gen.textStatus = 'generating';
  refreshWorkbench();
  try {
    const data = await api('/api/step3/generate-text', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ etsyId: match.etsyId })
    });
    // Merge all returned fields
    if (data.images) gen.images = data.images;
    gen.optimizedTitle = data.optimizedTitle || '';
    gen.optimizedDescription = data.optimizedDescription || '';
    gen.optimizedTags = data.optimizedTags || '';
    gen.suggestedPrice = data.suggestedPrice || '';
    gen.textStatus = data.textStatus || 'success';
    gen.textError = data.textError || '';
    if (data.originalTitle) gen.originalTitle = data.originalTitle;
    if (data.originalDescription) gen.originalDescription = data.originalDescription;
    if (data.originalTags) gen.originalTags = data.originalTags;
    refreshWorkbench();
    toast('文案生成完成', gen.textStatus === 'success' ? 'ok' : 'err');
  } catch (e) {
    gen.textStatus = 'failed';
    gen.textError = e.message;
    refreshWorkbench();
    toast('文案生成失败: ' + e.message, 'err');
  }
}

// ── Right Panel ─────────────────────────────────────────

function populateRightPanel(match, gen) {
  // Find active image
  const activeImg = S.activeImageId
    ? gen.images.find(im => im.id === S.activeImageId)
    : gen.images[0];
  const previewImg = activeImg || gen.images[0];
  const showAI = S.previewShowingAI && previewImg && previewImg.imageStatus === 'success' && previewImg.generatedUrl;
  const previewUrl = showAI ? previewImg.generatedUrl : (previewImg ? previewImg.originalUrl : '');
  const previewStatus = previewImg ? previewImg.imageStatus : 'pending';

  document.getElementById('wbRight').innerHTML = `
    <div class="wb-section">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <h3 style="margin:0">🔍 预览 — ${esc(previewImg?.label || '选择图片')}</h3>
        <span class="wb-preview-status status-${previewStatus}">${statusLabel(previewStatus)}</span>
      </div>
      <div class="wb-preview-box" id="wbPreviewBox">
        ${previewUrl
          ? `<img src="${previewUrl}" alt="preview">`
          : '<div class="wb-preview-placeholder">点击中间图片<br>选择预览</div>'}
        ${previewImg && previewImg.imageStatus === 'success' && previewImg.generatedUrl ? `
          <button class="wb-preview-toggle" onclick="togglePreview()">
            ${S.previewShowingAI ? '显示原图' : '显示 AI 图'}
          </button>` : ''}
      </div>
      ${previewImg ? `
        <div style="display:flex;gap:6px;margin-top:6px">
          <button class="btn btn-xs btn-outline" id="btnGenPreview"
            ${previewImg.imageStatus === 'generating' ? 'disabled' : ''}
            onclick="generateImage('${match.etsyId}','${previewImg.id}')">
            ${previewImg.imageStatus === 'generating' ? '生成中...' : '🖼️ 生成此图'}
          </button>
        </div>` : ''}
    </div>

    <div class="wb-section">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <h3 style="margin:0">📝 AI 文案
          <span class="status-dot ${gen.textStatus}"></span>
          <span style="font-size:11px;font-weight:400;color:var(--text2)">${statusLabel(gen.textStatus)}</span>
        </h3>
      </div>

      <div class="wb-field">
        <label>Etsy 标题 <button class="btn btn-xs" style="background:none;border:none;cursor:pointer;font-size:10px;color:var(--accent)" onclick="copyText('wbAiTitle')">📋</button></label>
        <textarea id="wbAiTitle" onchange="saveWorkbenchEdit('optimizedTitle',this.value)" placeholder="点击「生成文案」按钮生成...">${esc(gen.optimizedTitle)}</textarea>
      </div>
      <div class="wb-field">
        <label>商品描述 <button class="btn btn-xs" style="background:none;border:none;cursor:pointer;font-size:10px;color:var(--accent)" onclick="copyText('wbAiDesc')">📋</button></label>
        <textarea id="wbAiDesc" onchange="saveWorkbenchEdit('optimizedDescription',this.value)" placeholder="点击「生成文案」按钮生成..." style="min-height:80px">${esc(gen.optimizedDescription)}</textarea>
      </div>
      <div class="wb-field">
        <label>Tags</label>
        <textarea id="wbAiTags" onchange="saveWorkbenchEdit('optimizedTags',this.value)" placeholder="点击「生成文案」按钮生成...">${esc(gen.optimizedTags)}</textarea>
      </div>
      <div class="wb-field">
        <label>建议售价</label>
        <input type="text" id="wbAiPrice" value="${esc(gen.suggestedPrice)}" onchange="saveWorkbenchEdit('suggestedPrice',this.value)" placeholder="$0.00" style="width:100%;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12px;font-family:inherit">
      </div>

      <button class="btn btn-sm btn-outline" id="btnGenText"
        ${gen.textStatus === 'generating' ? 'disabled' : ''}
        onclick="generateText()" style="width:100%">
        ${gen.textStatus === 'generating' ? '<span class="spinner"></span> 生成中...' : '📝 生成文案'}
      </button>
      ${gen.textStatus === 'failed' && gen.textError ? `<div style="font-size:11px;color:var(--red);margin-top:6px">错误: ${esc(gen.textError)}</div>` : ''}
    </div>`;
}

function togglePreview() {
  S.previewShowingAI = !S.previewShowingAI;
  const match = curMatch();
  const gen = curGen();
  if (match && gen) populateRightPanel(match, gen);
}

// ── Match Navigation ─────────────────────────────────────

function navigateMatch(delta) {
  const newIdx = S.currentMatchIndex + delta;
  if (newIdx < 0 || newIdx >= S.matches.length) return;
  S.currentMatchIndex = newIdx;
  S.activeImageId = null;
  S.previewShowingAI = false;
  document.getElementById('wbMatchSelect').value = newIdx;
  refreshWorkbench();
}

function jumpToMatch(val) {
  S.currentMatchIndex = parseInt(val) || 0;
  S.activeImageId = null;
  S.previewShowingAI = false;
  refreshWorkbench();
}

// ── Text Editing ────────────────────────────────────────

async function saveWorkbenchEdit(field, value) {
  const match = curMatch();
  const gen = curGen();
  if (!match || !gen) return;
  gen[field] = value;
  await api('/api/step3/update-content', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ etsyId: match.etsyId, field, value })
  }).catch(() => {});
}

// ── Download ─────────────────────────────────────────────

function downloadResults() {
  const data = {};
  for (const m of S.matches) {
    const gen = S.generations[m.etsyId];
    if (!gen) continue;
    data[m.etsyId] = {
      title: gen.optimizedTitle,
      description: gen.optimizedDescription,
      tags: gen.optimizedTags,
      price: gen.suggestedPrice,
      textStatus: gen.textStatus,
      images: gen.images.map(im => ({
        label: im.label,
        status: im.imageStatus,
        original: im.originalUrl,
        generated: im.generatedUrl,
      })),
    };
  }
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ai_generation_results.json';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('结果已下载', 'ok');
}

// ═══════════════════════════════════════════════════════════════
// Step 4 — Publish (Mock)
// ═══════════════════════════════════════════════════════════════
function renderStep4() {
  const m = S.matches;
  if (!m.length) {
    document.getElementById('publishContent').innerHTML = '<div class="empty-state"><div class="empty-icon">🚀</div><h3>无内容可发布</h3><p>请先完成前面的步骤。</p></div>';
    document.getElementById('action4').style.display = 'none';
    return;
  }
  document.getElementById('action4').style.display = 'flex';

  const ready = m.filter(x => {
    const g = S.generations[x.etsyId];
    const firstImg = g?.images?.[0];
    return g && firstImg?.imageStatus === 'success' && g.textStatus === 'success';
  }).length;

  document.getElementById('publishContent').innerHTML = `
    <div class="publish-summary">
      <h2>🚀 准备发布 ${m.length} 件商品</h2>
      <p>${ready} / ${m.length} 件已完成 AI 内容生成（图片 + 文案均就绪）</p>
      <div style="display:flex;gap:12px;justify-content:center">
        <div class="stat-card"><div class="stat-value">${m.length}</div><div class="stat-label">总商品</div></div>
        <div class="stat-card"><div class="stat-value" style="color:var(--green)">${ready}</div><div class="stat-label">已就绪</div></div>
        <div class="stat-card"><div class="stat-value" style="color:var(--amber)">${m.length-ready}</div><div class="stat-label">待完善</div></div>
      </div>
    </div>
    <div class="publish-list">${m.map(x => {
      const g = S.generations[x.etsyId];
      const firstImg = g?.images?.[0];
      const ok = g && firstImg?.imageStatus === 'success' && g.textStatus === 'success';
      const imgUrl = firstImg?.generatedUrl || firstImg?.originalUrl || '/api/placeholder/' + x.etsyId;
      return `<div class="publish-item">
        <div class="pub-img"><img src="${imgUrl}" alt=""></div>
        <div class="pub-info">
          <div class="pub-title">${esc(g?.optimizedTitle || (S.products.find(p=>p.id===x.etsyId)?.title||''))}</div>
          <div class="pub-meta">售价: ${esc(g?.suggestedPrice||'—')} | 1688成本: ${x.priceDisplay} | 利润率: ${x.profitMargin}%</div>
        </div>
        <div class="pub-status">
          ${ok ? '<span class="badge badge-ok">✓ 就绪</span>' : '<span class="badge badge-warn">待生成</span>'}
        </div>
      </div>`;
    }).join('')}</div>`;
}

async function publishAll() {
  try {
    const data = await api('/api/step4/publish', { method:'POST', headers:{'Content-Type':'application/json'}, body:'{}' });
    toast(`🎉 已提交 ${data.published} 件商品到 Etsy（Mock）`, 'ok');
    renderStep4();
  } catch(e) { toast('发布失败: '+e.message, 'err'); }
}

// ═══════════════════════════════════════════════════════════════
// Helpers
// ═══════════════════════════════════════════════════════════════
function statusLabel(s) {
  const map = { pending: '○ 等待', generating: '◉ 生成中', success: '✓ 完成', failed: '✗ 失败' };
  return map[s] || s;
}
function esc(s) { if (!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(msg, type) {
  const c = document.getElementById('toastContainer');
  const d = document.createElement('div');
  d.className = 'toast toast-' + (type === 'ok' ? 'ok' : type === 'err' ? 'err' : 'info');
  d.textContent = msg;
  c.appendChild(d);
  setTimeout(() => d.remove(), 3000);
}
function copyText(id) {
  const el = document.getElementById(id);
  if (!el) return;
  navigator.clipboard.writeText(el.value || el.textContent || '').then(() => {
    toast('已复制到剪贴板', 'ok');
  }).catch(() => {
    // Fallback for older browsers
    el.select?.();
    document.execCommand?.('copy');
    toast('已复制', 'ok');
  });
}

// Init
goStep1();
</script>
</body>
</html>
