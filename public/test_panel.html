<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Etsy → 1688 生成任务面板</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; color: #222; padding: 24px; }
  h1 { font-size: 20px; margin-bottom: 16px; }
  .toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; padding: 16px; background: #fff; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .toolbar label { font-weight: 600; font-size: 13px; white-space: nowrap; }
  .toolbar input[type="file"] { font-size: 13px; }
  .toolbar button { padding: 8px 20px; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: 600; }
  .btn-upload { background: #e8e8e8; color: #333; }
  .btn-download { background: #2563eb; color: #fff; }
  .btn-gen-img { background: #059669; color: #fff; padding: 5px 14px; font-size: 12px; border: none; border-radius: 5px; cursor: pointer; white-space: nowrap; }
  .btn-gen-text { background: #7c3aed; color: #fff; padding: 5px 14px; font-size: 12px; border: none; border-radius: 5px; cursor: pointer; white-space: nowrap; }
  .btn-gen-img:disabled, .btn-gen-text:disabled { opacity: .45; cursor: not-allowed; }
  .stats { font-size: 13px; color: #666; margin-left: auto; }
  .table-wrap { overflow-x: auto; background: #fff; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { background: #fafafa; text-align: left; padding: 10px 12px; border-bottom: 2px solid #e5e5e5; font-weight: 600; white-space: nowrap; position: sticky; top: 0; }
  td { padding: 10px 12px; border-bottom: 1px solid #eee; vertical-align: top; }
  tr:hover td { background: #f9fafb; }
  .col-title { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .col-prompt { max-width: 300px; font-size: 11px; color: #555; white-space: pre-wrap; word-break: break-word; line-height: 1.5; }
  .col-status { text-align: center; }
  .status-pending { display: inline-block; padding: 3px 10px; border-radius: 10px; background: #fef3c7; color: #92400e; font-size: 11px; font-weight: 600; }
  .status-done { display: inline-block; padding: 3px 10px; border-radius: 10px; background: #d1fae5; color: #065f46; font-size: 11px; font-weight: 600; }
  .status-error { display: inline-block; padding: 3px 10px; border-radius: 10px; background: #fee2e2; color: #991b1b; font-size: 11px; font-weight: 600; }
  .result-cell { max-width: 260px; }
  .result-cell img { max-width: 200px; max-height: 160px; border-radius: 6px; border: 1px solid #ddd; display: block; }
  .result-cell .text-result { font-size: 12px; color: #333; line-height: 1.6; max-height: 120px; overflow-y: auto; white-space: pre-wrap; }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .empty { text-align: center; padding: 60px; color: #999; font-size: 14px; }
  .toast { position: fixed; bottom: 24px; right: 24px; padding: 12px 20px; border-radius: 8px; color: #fff; font-size: 14px; z-index: 999; animation: fadeIn .3s; }
  .toast-info { background: #2563eb; }
  .toast-error { background: #dc2626; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #fff; border-top-color: transparent; border-radius: 50%; animation: spin .6s linear infinite; vertical-align: middle; margin-right: 4px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<h1>Etsy → 1688 生成任务面板</h1>

<div class="toolbar">
  <label for="csvFile">CSV 文件:</label>
  <input type="file" id="csvFile" accept=".csv">
  <button class="btn-upload" id="btnDemo">加载示例</button>
  <button class="btn-download" id="btnDownload" disabled>下载更新后的 CSV</button>
  <span class="stats" id="stats"></span>
</div>

<div class="table-wrap">
  <table id="taskTable">
    <thead>
      <tr>
        <th style="width:30px">#</th>
        <th class="col-title">etsy_title</th>
        <th class="col-title">1688_title</th>
        <th style="width:180px">1688_url</th>
        <th class="col-prompt">image2_prompt</th>
        <th class="col-prompt">deepseek_prompt</th>
        <th>生成结果</th>
        <th style="width:110px">操作</th>
        <th class="col-status" style="width:70px">status</th>
      </tr>
    </thead>
    <tbody>
      <tr><td colspan="9" class="empty">请上传 future_generation_tasks.csv 或点击「加载示例」</td></tr>
    </tbody>
  </table>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
// State
// ═══════════════════════════════════════════════════════════════

let tasks = [];

// ═══════════════════════════════════════════════════════════════
// CSV Parser (client-side, handles quoted fields)
// ═══════════════════════════════════════════════════════════════

function parseCSV(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  if (lines.length < 2) return [];

  const headers = splitLine(lines[0]);
  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    const vals = splitLine(lines[i]);
    const row = {};
    headers.forEach((h, j) => { row[h.trim()] = vals[j] ?? ''; });
    rows.push(row);
  }
  return rows;
}

function splitLine(line) {
  const fields = [];
  let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') {
      if (inQ && line[i+1] === '"') { cur += '"'; i++; }
      else inQ = !inQ;
    } else if (ch === ',' && !inQ) {
      fields.push(cur); cur = '';
    } else {
      cur += ch;
    }
  }
  fields.push(cur);
  return fields;
}

function escapeCSV(v) {
  if (!v) return '';
  const s = String(v);
  if (s.includes(',') || s.includes('"') || s.includes('\n')) {
    return '"' + s.replace(/"/g, '""') + '"';
  }
  return s;
}

function buildCSV(arr) {
  const headers = ['etsy_title','1688_title','1688_url','image2_prompt','deepseek_prompt','status'];
  const lines = [headers.join(',')];
  for (const r of arr) {
    lines.push(headers.map(h => escapeCSV(r[h] ?? '')).join(','));
  }
  return lines.join('\n');
}

// ═══════════════════════════════════════════════════════════════
// API calls (proxied through local server to read .env keys)
// ═══════════════════════════════════════════════════════════════

async function callImage2(prompt) {
  const res = await fetch('/api/generate-image', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ prompt }),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error || `Image2 HTTP ${res.status}`);
  }
  return res.json();
}

async function callDeepseek(prompt) {
  const res = await fetch('/api/generate-text', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ prompt }),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error || `Deepseek HTTP ${res.status}`);
  }
  return res.json();
}

// ═══════════════════════════════════════════════════════════════
// Render
// ═══════════════════════════════════════════════════════════════

function render() {
  const tbody = document.querySelector('#taskTable tbody');
  if (tasks.length === 0) {
    tbody.innerHTML = '<tr><td colspan="9" class="empty">请上传 future_generation_tasks.csv 或点击「加载示例」</td></tr>';
  } else {
    tbody.innerHTML = tasks.map((t, i) => {
      const statusCls = t.status === 'done' ? 'status-done' : (t.status === 'error' ? 'status-error' : 'status-pending');
      const imgDisabled = t.status === 'done' ? 'disabled' : '';
      const textDisabled = t.status === 'done' ? 'disabled' : '';
      return `<tr>
        <td>${i + 1}</td>
        <td class="col-title" title="${esc(t.etsy_title)}">${esc(t.etsy_title)}</td>
        <td class="col-title" title="${esc(t['1688_title'])}">${esc(t['1688_title'])}</td>
        <td style="font-size:11px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(t['1688_url'])}"><a href="${esc(t['1688_url'])}" target="_blank" style="color:#2563eb">${esc(truncateUrl(t['1688_url'], 35))}</a></td>
        <td class="col-prompt">${esc(t.image2_prompt)}</td>
        <td class="col-prompt">${esc(t.deepseek_prompt)}</td>
        <td class="result-cell">${renderResult(t)}</td>
        <td class="actions">
          ${t.status === 'done'
            ? '<span style="font-size:11px;color:#999">已完成</span>'
            : `<button class="btn-gen-img" ${imgDisabled} onclick="handleGenImage(${i})">生成图片</button>
               <button class="btn-gen-text" ${textDisabled} onclick="handleGenText(${i})">生成文案</button>`}
        </td>
        <td class="col-status"><span class="${statusCls}">${esc(t.status)}</span></td>
      </tr>`;
    }).join('');
  }

  // Stats
  const done = tasks.filter(t => t.status === 'done').length;
  document.getElementById('stats').textContent = `${done}/${tasks.length} 已完成`;
  document.getElementById('btnDownload').disabled = tasks.length === 0;
}

function renderResult(t) {
  if (t.generated_image) {
    return `<img src="${esc(t.generated_image)}" alt="generated" onerror="this.alt='图片加载失败'">`;
  }
  if (t.generated_text) {
    return `<div class="text-result">${esc(t.generated_text)}</div>`;
  }
  return '<span style="font-size:11px;color:#aaa">—</span>';
}

function esc(s) {
  if (!s) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function truncateUrl(url, max) {
  if (!url) return '';
  return url.length > max ? url.slice(0, max - 3) + '...' : url;
}

// ═══════════════════════════════════════════════════════════════
// Actions
// ═══════════════════════════════════════════════════════════════

async function handleGenImage(idx) {
  const t = tasks[idx];
  if (!t || t.status === 'done') return;
  const btn = document.querySelectorAll('.btn-gen-img')[idx];
  const origText = btn.textContent;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>生成中';

  try {
    const data = await callImage2(t.image2_prompt);
    // data.url is the image URL returned by Image2 API
    t.generated_image = data.url ?? data.image_url ?? '';
    t.status = 'done';
    toast('图片生成成功', 'info');
  } catch (e) {
    t.status = 'error';
    toast('图片生成失败: ' + e.message, 'error');
  }
  btn.textContent = origText;
  render();
}

async function handleGenText(idx) {
  const t = tasks[idx];
  if (!t || t.status === 'done') return;
  const btn = document.querySelectorAll('.btn-gen-text')[idx];
  const origText = btn.textContent;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>生成中';

  try {
    const data = await callDeepseek(t.deepseek_prompt);
    // data.text is the generated content from Deepseek
    t.generated_text = data.text ?? data.content ?? '';
    t.status = 'done';
    toast('文案生成成功', 'info');
  } catch (e) {
    t.status = 'error';
    toast('文案生成失败: ' + e.message, 'error');
  }
  btn.textContent = origText;
  render();
}

function downloadCSV() {
  const csv = buildCSV(tasks);
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'future_generation_tasks.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}

function toast(msg, type) {
  const el = document.createElement('div');
  el.className = 'toast toast-' + (type || 'info');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

// ═══════════════════════════════════════════════════════════════
// File upload
// ═══════════════════════════════════════════════════════════════

document.getElementById('csvFile').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    tasks = parseCSV(reader.result).map(r => ({
      etsy_title: r['etsy_title'] || '',
      '1688_title': r['1688_title'] || '',
      '1688_url': r['1688_url'] || '',
      image2_prompt: r['image2_prompt'] || '',
      deepseek_prompt: r['deepseek_prompt'] || '',
      status: r['status'] || 'pending',
      generated_image: r['generated_image'] || '',
      generated_text: r['generated_text'] || '',
    }));
    render();
  };
  reader.readAsText(file, 'utf-8');
});

// Demo: load the real CSV from server
document.getElementById('btnDemo').addEventListener('click', async () => {
  try {
    const res = await fetch('/api/tasks-csv');
    if (!res.ok) throw new Error('No tasks found');
    const text = await res.text();
    tasks = parseCSV(text).map(r => ({
      etsy_title: r['etsy_title'] || '',
      '1688_title': r['1688_title'] || '',
      '1688_url': r['1688_url'] || '',
      image2_prompt: r['image2_prompt'] || '',
      deepseek_prompt: r['deepseek_prompt'] || '',
      status: r['status'] || 'pending',
      generated_image: r['generated_image'] || '',
      generated_text: r['generated_text'] || '',
    }));
    render();
    toast(`已加载 ${tasks.length} 条任务`, 'info');
  } catch (e) {
    // Fallback: try fetching from output dir relative path
    try {
      const res2 = await fetch('/output/future_generation_tasks.csv');
      if (res2.ok) {
        const text = await res2.text();
        tasks = parseCSV(text).map(r => ({
          etsy_title: r['etsy_title'] || '',
          '1688_title': r['1688_title'] || '',
          '1688_url': r['1688_url'] || '',
          image2_prompt: r['image2_prompt'] || '',
          deepseek_prompt: r['deepseek_prompt'] || '',
          status: r['status'] || 'pending',
          generated_image: r['generated_image'] || '',
          generated_text: r['generated_text'] || '',
        }));
        render();
        toast(`已加载 ${tasks.length} 条任务`, 'info');
        return;
      }
    } catch {}
    toast('无法加载示例数据，请手动上传 CSV 文件', 'error');
  }
});

document.getElementById('btnDownload').addEventListener('click', downloadCSV);
</script>

</body>
</html>
